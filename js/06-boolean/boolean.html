<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boolean</title>
  </head>
  <body>
    <script>
      console.log(4 > 32);
      console.log(3 == "3.000");
      console.log(3 === "3.000");
      console.log(3 != "3.000"); // compares values only (ignores type)
      console.log(3 !== "3.000"); // compares value AND type

      if (16 >= 18) {
        console.log("You are old enough");
      } else if (19 < 18) {
        console.log("you are near");
      } else {
        console.log("too young kiddo");
      }

      const age = 91;

      if (12 < age && age < 18) {
        console.log("you are a teenagar");
      }
      if (age <= 12) {
        console.log("You are a kid");
      } else {
        console.log("youre old");
      }

      console.log(true || false);
      console.log(!false);

      if (1) {
        console.log("truthy");
      }

      const cartQuantity = 1;

      if (cartQuantity) {
        console.log("Cart has products");
      }

      console.log(!0);

      console.log("Luffy" / 2);

      let pogi;
      console.log(pogi);

      true ? "truthy" : "falsy";
      const result = false ? "truthy" : "Falsy";
      console.log(result);

      false && console.log("Hi");
      const message = true && "Hello";
      console.log(message);

      const currency = false || "USD";
      console.log(currency);
    </script>
  </body>
</html>
